branches:
  - master
  - release-drafter  # for testing edits to this configuration

# The version isn't resolved from PR labels — script_version.hpp and the
# git tag created at release time are the source of truth. Retitle/retag
# this draft to match before publishing.
name-template: 'Unreleased'
tag-template: 'unreleased'

sort-by: title # sort alphabetically
sort-direction: ascending

# Labels match the changelog/* scheme used by the other TTT mods, so
# labeling a PR works the same way in every repo. Category titles stay
# German; they map onto Keep a Changelog's Added/Changed/Deprecated/
# Removed/Fixed/Security concepts (https://keepachangelog.com/en/1.1.0/).
categories:
  - title: 'NEU:'
    labels:
      - 'changelog/added'
  - title: 'VERÄNDERT:'
    labels:
      - 'changelog/changed'
  - title: 'VERALTET:'
    labels:
      - 'changelog/deprecated'
  - title: 'ENTFERNT:'
    labels:
      - 'changelog/removed'
  - title: 'REPARIERT:'
    labels:
      - 'changelog/fixed'
  - title: 'SICHERHEIT:'
    labels:
      - 'changelog/security'

exclude-labels:
  - 'ignore-changelog'
  - 'tools'
  - 'documentation'

change-template: '* $TITLE (#$NUMBER) by $AUTHOR'
template: |
  _Requires the latest Version of [CBA](https://github.com/CBATeam/CBA_A3) and [ACE](https://github.com/acemod/ACE3)._

  Full Documentation can be found under [https://docs.tacticalteam.de](https://docs.tacticalteam.de).

  ## Zusammenfassung

  $CHANGES

  ## Mitwirkende

  $CONTRIBUTORS

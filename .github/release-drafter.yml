branches:
  - master
  - release-drafter  # for testing edits to this configuration

# The version isn't resolved from PR labels — script_version.hpp and the
# git tag created at release time are the source of truth. Retitle/retag
# this draft to match before publishing.
name-template: 'Unreleased'
tag-template: 'unreleased'

sort-by: title # sort alphabetically
sort-direction: ascending

categories:
  - title: 'NEU:'
    labels:
      - 'pr/feature'
  - title: 'REPARIERT:'
    labels:
      - 'pr/bug-fix'
  - title: ' VERBESSERT:'
    labels:
      - 'pr/enhancement'
      - 'pr/optimization'
  - title: 'VERÄNDERT:'
    labels:
      - 'pr/cleanup'
      - 'pr/change'
  - title: 'EINSTELLUNGEN:'
    labels:
      - 'pr/setting'
  - title: 'ÜBERSETZUNGEN:'
    labels:
      - 'pr/translation'
  - title: 'DOKUMENTATION:'
    labels:
      - 'pr/documentation'

exclude-labels:
  - 'ignore-changelog'
  - 'tools'

change-template: '* $TITLE (#$NUMBER) by $AUTHOR'
template: |
  _Requires the latest Version of [CBA](https://github.com/CBATeam/CBA_A3) and [ACE](https://github.com/acemod/ACE3)._

  Full Documentation can be found under [https://docs.tacticalteam.de](https://docs.tacticalteam.de).

  ## Zusammenfassung

  ## Änderungsprotokoll

  $CHANGES

  ## Mitwirkende

  $CONTRIBUTORS

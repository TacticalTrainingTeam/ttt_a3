<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TTT Handbook</title>
<style>
:root {
    --cover: #3b2a1c;
    --cover-dark: #241810;
    --paper: #f1e7d0;
    --paper-light: #f8f1e0;
    --paper-edge: #d9c9a6;
    --ink: #2b2118;
    --ink-soft: #6a5944;
    --rule: #bda98a;
    --accent: #7a2418;
    --ribbon: #8c2a1c;
    --serif: Georgia, "Palatino Linotype", "Book Antiqua", Palatino, "Times New Roman", serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
    padding: 14px 16px 18px;
    background: radial-gradient(ellipse at 50% 35%, var(--cover), var(--cover-dark));
    color: var(--ink);
    font: 19px/1.55 var(--serif);
    overflow: hidden;
}
#book {
    position: relative;
    display: grid;
    grid-template-columns: minmax(250px, 34%) 1fr;
    height: 100%;
    background: var(--paper);
    border-radius: 3px;
    box-shadow:
        1px 0 0 var(--paper-edge), 3px 1px 0 var(--paper-light), 4px 1px 0 var(--paper-edge),
        -1px 0 0 var(--paper-edge), -3px 1px 0 var(--paper-light), -4px 1px 0 var(--paper-edge),
        0 5px 0 var(--paper-edge), 0 10px 22px rgba(0, 0, 0, .65);
}
.page { position: relative; min-height: 0; display: flex; flex-direction: column; }
#left {
    padding: 34px 30px 16px 36px;
    background: linear-gradient(to right, var(--paper-light) 0%, var(--paper) 72%, #dfd0b2 93%, #b9a581 100%);
    border-radius: 3px 0 0 3px;
}
#right {
    padding: 34px 26px 16px 44px;
    background: linear-gradient(to left, var(--paper-light) 0%, var(--paper) 78%, #e2d4b7 95%, #b9a581 100%);
    border-radius: 0 3px 3px 0;
}

    opacity: .11;
    pointer-events: none;
}
#right main, #right .folio { position: relative; z-index: 1; }
#title {
    margin: 0;
    padding-bottom: 10px;
    color: var(--accent);
    font-size: 28px;
    font-weight: normal;
    font-variant: small-caps;
    letter-spacing: .05em;
    text-align: center;
    border-bottom: 3px double var(--rule);
}
nav, main { flex: 1; min-height: 0; overflow-y: auto; }
nav { padding-right: 6px; }
nav h2 {
    margin: 15px 0 3px;
    color: var(--accent);
    font-size: 17px;
    font-weight: normal;
    font-variant: small-caps;
    letter-spacing: .07em;
}
nav button {
    display: flex;
    align-items: baseline;
    width: 100%;
    padding: 3px 4px;
    color: var(--ink);
    background: none;
    border: 0;
    font: 17px/1.3 var(--serif);
    text-align: left;
    cursor: pointer;
}
nav button .name { flex: 0 1 auto; }
nav button .leader { flex: 1 1 18px; min-width: 18px; margin: 0 5px; border-bottom: 1px dotted var(--ink-soft); }
nav button .number { flex: none; color: var(--ink-soft); }
nav button:hover, nav button:focus { color: var(--accent); outline: none; }
nav button.active { color: var(--accent); background: rgba(122, 36, 24, .09); font-weight: bold; }
main { padding-right: 16px; }
article h2 {
    margin: 0;
    padding-right: 124px;
    color: var(--accent);
    font-size: 32px;
    font-weight: normal;
    line-height: 1.2;
}
.motto { margin: 4px 0 16px; padding: 0 124px 10px 0; color: var(--ink-soft); font-style: italic; border-bottom: 1px solid var(--rule); }
article h3 { margin: 20px 0 4px; font-size: 21px; font-variant: small-caps; letter-spacing: .03em; }
article p { margin: 7px 0; }
article ul { margin: 4px 0 9px; padding-left: 21px; list-style-type: "– "; }
article li { margin: 2px 0; }
article strong { font-weight: bold; }
.marked { border-bottom: 3px solid; font-weight: bold; }
.rule { margin: 22px 0 8px; padding: 9px 4px; font-style: italic; text-align: center; border-top: 3px double var(--rule); border-bottom: 3px double var(--rule); }
.folio { flex: none; padding-top: 8px; color: var(--ink-soft); font-size: 16px; text-align: center; }
#close {
    position: absolute;
    top: -8px;
    right: 52px;
    z-index: 2;
    width: 102px;
    padding: 18px 4px 24px;
    color: #f8efdc;
    background: var(--ribbon);
    border: 0;
    font: 15px/1.1 var(--serif);
    cursor: pointer;
    clip-path: polygon(0 0, 100% 0, 100% 100%, 50% calc(100% - 12px), 0 100%);
}
#close:hover, #close:focus { background: var(--accent); outline: none; }
::-webkit-scrollbar { width: 7px; }
::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 4px; }
::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div id="book">
    <button id="close" type="button">&times;</button>
    <section id="left" class="page">
        <h1 id="title"></h1>
        <nav id="nav"></nav>
    </section>
    <section id="right" class="page">
        <main id="main"><article id="topic"></article></main>
        <div id="folio" class="folio"></div>
    </section>
</div>
<script>
(function () {
    "use strict";

    // Must match the HANDBOOK_MESSAGE_* defines in script_component.hpp
    var MESSAGE_READY = "ttt_handbook:ready";
    var MESSAGE_CLOSE = "ttt_handbook:close";
    var INLINE_TOKENS = /%3|%4|<t color='(#[0-9a-fA-F]{6})'>|<\/t>/g;
    var HEADING_LINE = /^%3((?:(?!%[34]).)*)%4$/;

    var nav = document.getElementById("nav");
    var main = document.getElementById("main");
    var topicView = document.getElementById("topic");
    var folio = document.getElementById("folio");
    var closeButton = document.getElementById("close");

    function send(message) {
        if (typeof A3API !== "undefined") {
            A3API.SendAlert(message);
        }
    }

    function element(tag, text, className) {
        var node = document.createElement(tag);
        if (text !== undefined) { node.textContent = text; }
        if (className) { node.className = className; }
        return node;
    }

    // Hint markup is rebuilt as DOM nodes so config text is never interpreted as HTML
    function appendInline(parent, text) {
        var strong = false;
        var color = "";
        var position = 0;
        var match;

        function flush(end) {
            if (end <= position) { return; }
            var run = text.slice(position, end);
            var node = strong ? element("strong", run) : element("span", run);
            // Hint colors are chosen for dark backgrounds and are unreadable as text on paper
            if (color) {
                node.className = "marked";
                node.style.borderBottomColor = color;
            }
            parent.appendChild(node);
        }

        INLINE_TOKENS.lastIndex = 0;
        while ((match = INLINE_TOKENS.exec(text)) !== null) {
            flush(match.index);
            position = match.index + match[0].length;
            if (match[0] === "%3") { strong = true; }
            else if (match[0] === "%4") { strong = false; }
            else if (match[0] === "</t>") { color = ""; }
            else { color = match[1]; }
        }
        flush(text.length);
    }

    function renderDescription(parent, description) {
        var list = null;

        description.split("<br/>").forEach(function (rawLine) {
            var line = rawLine.trim();
            if (!line) {
                list = null;
                return;
            }
            if (line.indexOf("%11") === 0) {
                if (!list) {
                    list = element("ul");
                    parent.appendChild(list);
                }
                var item = element("li");
                appendInline(item, line.slice(3).trim());
                list.appendChild(item);
                return;
            }

            list = null;
            var isPoint = line.indexOf("%2") === 0;
            var content = isPoint ? line.slice(2).trim() : line;
            var heading = isPoint && content.match(HEADING_LINE);
            if (heading) {
                parent.appendChild(element("h3", heading[1].trim()));
                return;
            }
            var isRule = isPoint && /^(Golden rule|Grundsatz):/.test(content);
            var paragraph = element("p", undefined, isRule ? "rule" : "");
            appendInline(paragraph, content);
            parent.appendChild(paragraph);
        });
    }

    function showTopic(topic, button, number) {
        var active = nav.querySelector(".active");
        if (active) { active.classList.remove("active"); }
        button.classList.add("active");

        topicView.textContent = "";
        topicView.appendChild(element("h2", topic.title));
        if (topic.motto) { topicView.appendChild(element("p", topic.motto, "motto")); }
        renderDescription(topicView, topic.description);
        folio.textContent = "– " + number + " –";
        main.scrollTop = 0;
    }

    function contentsEntry(topic, number) {
        var button = element("button");
        button.type = "button";
        button.appendChild(element("span", topic.title, "name"));
        button.appendChild(element("span", undefined, "leader"));
        button.appendChild(element("span", String(number), "number"));
        button.addEventListener("click", function () { showTopic(topic, button, number); });
        return button;
    }

    function render(data) {
        document.getElementById("title").textContent = data.title;
        closeButton.textContent = data.closeLabel;
        nav.textContent = "";

        var number = 0;
        var first = null;
        data.chapters.forEach(function (chapter) {
            nav.appendChild(element("h2", chapter.title));
            chapter.topics.forEach(function (topic) {
                number += 1;
                var button = contentsEntry(topic, number);
                nav.appendChild(button);
                first = first || { topic: topic, button: button };
            });
        });
        if (first) { showTopic(first.topic, first.button, 1); }
    }

    window.tttHandbook = {
        receive: function (base64) {
            var bytes = Uint8Array.from(atob(base64), function (c) { return c.charCodeAt(0); });
            render(JSON.parse(new TextDecoder("utf-8").decode(bytes)));
        }
    };

    closeButton.addEventListener("click", function () { send(MESSAGE_CLOSE); });
    document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") { send(MESSAGE_CLOSE); }
    });
    send(MESSAGE_READY);
}());
</script>
</body>
</html>
